name: Rebuild RU Bypass profile

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ru-bypass.json
          git diff --cached --quiet || git commit -m "Rebuild profile from upstream lists"
          git push
